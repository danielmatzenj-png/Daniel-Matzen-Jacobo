# Configuración del asistente Jarvis local

wake_word:
  model: "hey_jarvis"
  threshold: 0.5
  sample_rate: 16000
  frame_length: 1280

stt:
  model: "base"
  device: "auto"
  compute_type: "int8"
  language: "es"
  silence_duration: 1.2
  silence_threshold: 0.01
  max_record_seconds: 30

tts:
  rate: 180
  volume: 1.0
  voice: "spanish"

llm:
  # Backend: "ollama" (requiere Ollama instalado) o "llamacpp" (sin Ollama, solo Python)
  backend: "ollama"

  # --- Configuración para backend: ollama ---
  host: "http://localhost:11434"
  model: "llama3.1"

  # --- Configuración para backend: llamacpp ---
  # Descomenta estas líneas y cambia backend a "llamacpp" si no tienes Ollama.
  # Descarga un modelo con: python scripts/download_model.py
  # model_path: "models/qwen2.5-1.5b-instruct-q8_0.gguf"
  # n_gpu_layers: 0        # 0 = CPU puro  |  -1 = todo en GPU (requiere CUDA)
  # chat_format: null      # null = auto-detectar (recomendado)

  temperature: 0.2
  num_ctx: 4096

agent:
  language: "es"
  name: "Jarvis"
  confirm_dangerous: true
  max_iterations: 8
  workspace_root: "~"
