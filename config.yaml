# Configuración de mail2excel
# Flujo: Apple Mail (Mail.app) -> revisar correo + PDF adjunto -> Tabla BLs.xlsx
#        y, al final del día, resumen por correo.

# --- De dónde se leen los correos ---
source:
  type: "applescript"      # "applescript" (Apple Mail en macOS) o "json" (pruebas)
  account: ""              # Nombre EXACTO de la cuenta en Mail.app. Vacío = buzón unificado.
  mailbox: "inbox"         # Buzón. "inbox" = bandeja de entrada unificada.
  only_unread: true        # true = procesar solo correos no leídos (recomendado para runs repetidos).
  max_messages: 200        # Máximo de correos a leer por ejecución.
  save_attachments: true   # Guardar y leer los PDF adjuntos.

# --- Qué correos se procesan (filtro opcional en Python) ---
filters:
  sender_contains: ""      # Solo remitentes que contengan este texto (vacío = todos).
  subject_contains: ""     # Solo asuntos que contengan alguna palabra (lista o vacío = todos).
  body_contains: ""
  date_from: ""            # "YYYY-MM-DD"
  date_to: ""

# --- Salida: la tabla BLs ---
output:
  path: "~/Downloads/Tabla BLs.xlsx"
  sheet: "Sheet1"
  # Cabeceras EXACTAS tal como están en el Excel (orden de columnas A..I).
  headers:
    - "Status"
    - "Day"
    - "Customer"
    - "BL Nr"
    - "ETD"
    - "ETA"
    - "PCD"
    - "Internal Reference Nr"
    - "Notes"
  # Formato de fecha usado en las columnas Day / ETD / ETA.
  date_format: "%d.%m.%y"       # -> 28.07.26

# --- Valor fijo de la columna Status ---
status_value: "PEND"

# --- Clientes: cómo reconocer al remitente y su prefijo de nº de pedido interno ---
# 'match' se busca en remitente, asunto y cuerpo (sin distinguir mayúsculas).
# 'reference_pattern' captura el nº de referencia interno de ESE cliente.
customers:
  - name: "La Minita"
    match: ["la minita", "laminita"]
    reference_pattern: 'GF\s?\d{4,6}(?:[-/]\d{1,4})?'
  - name: "PCT LLC"
    match: ["pct llc", "pct "]
    reference_pattern: 'P5\d{3,5}'
  - name: "TCS LLC"
    match: ["tcs llc", "tcs "]
    reference_pattern: 'P-?\s?\d{3,6}'
  - name: "Cafe Capris"
    match: ["cafe capris", "café capris", "capris"]
    reference_pattern: 'S\d{4,6}'

# Si no se reconoce al cliente, se prueban todos estos prefijos como último recurso.
reference_fallback_patterns:
  - 'GF\s?\d{4,6}'
  - 'P5\d{3,5}'
  - 'P-?\s?\d{3,6}'
  - 'S\d{4,6}'

# --- Número de BL (Bill of Lading) ---
bl:
  # Etiquetas que suelen preceder al número de BL en el texto.
  labels:
    - 'b\s*/?\s*l\s*(?:nr|no|number|#|:)'
    - 'bill of lading'
    - 'master bl'
    - 'mbl'
    - 'hbl'
    - 'documento de embarque'
  # Prefijos de navieras (SCAC) para reconocer el BL aunque no lleve etiqueta.
  carrier_prefixes:
    - HLCU   # Hapag-Lloyd
    - MEDU   # MSC
    - MAEU   # Maersk
    - MSCU
    - ONEY   # Ocean Network Express
    - CMDU   # CMA CGM
    - COSU   # COSCO
    - OOLU   # OOCL
    - EGLV   # Evergreen
    - YMLU   # Yang Ming
    - HDMU   # HMM
    - SUDU   # Hamburg Süd
  # Longitud (letras+dígitos) del cuerpo tras el prefijo de naviera.
  min_len: 6
  max_len: 14

# --- ETD / ETA: etiquetas que preceden a la fecha en el correo/PDF ---
dates:
  etd_labels:
    - "etd"
    - "estimated time of departure"
    - "estimated departure"
    - "fecha de embarque"
    - "fecha estimada de embarque"
    - "salida"
    - "sailing"
  eta_labels:
    - "eta"
    - "estimated time of arrival"
    - "estimated arrival"
    - "fecha de arribo"
    - "fecha estimada de arribo"
    - "fecha de desembarque"
    - "llegada"
    - "arrival"

# --- Respaldo con IA (Claude) ---
# Modelo HÍBRIDO: primero reglas (gratis y local); si quedan campos vacíos,
# se consulta a Claude con el texto del correo + PDF. Requiere:
#   pip install anthropic   y   export ANTHROPIC_API_KEY=...
ai:
  enabled: true
  model: "claude-opus-5"     # puedes bajar a "claude-sonnet-5" o "claude-haiku-4-5" para ahorrar
  # Campos que dispararán la IA si quedaron vacíos tras las reglas.
  fallback_fields: ["customer", "bl_nr", "etd", "eta", "internal_reference"]
  max_chars: 6000            # recorte del texto (correo+PDF) enviado a la IA

# --- Resumen diario por correo ---
summary:
  to: "sebasmatzen@gmail.com"
  subject_prefix: "Resumen diario BLs"
  # Enviar por Apple Mail (macOS). Fuera de macOS solo se imprime/guarda.
  send_via: "applescript"
