# Configuración de mail2excel
# Automatización: Apple Mail (Mail.app) -> Excel de facturas/pedidos.

# --- De dónde se leen los correos ---
source:
  type: "applescript"      # "applescript" (Apple Mail en macOS) o "json" (pruebas)
  account: ""              # Nombre EXACTO de la cuenta en Mail.app. Vacío = buzón unificado.
  mailbox: "inbox"         # Buzón. "inbox" = bandeja de entrada unificada.
  only_unread: false       # true = procesar solo correos no leídos.
  max_messages: 200        # Máximo de correos a leer por ejecución.

# --- Qué correos nos interesan (se aplican en Python) ---
filters:
  # Solo correos cuyo remitente contenga alguno de estos textos (opcional).
  sender_contains: ""
  # Solo correos cuyo asunto contenga alguna de estas palabras (lista o texto).
  subject_contains:
    - "factura"
    - "invoice"
    - "pedido"
    - "recibo"
    - "comprobante"
  # Solo si el cuerpo/asunto contiene alguno de estos términos (opcional).
  body_contains: ""
  # Rango de fechas "YYYY-MM-DD" (opcional).
  date_from: ""
  date_to: ""

# --- Salida Excel ---
output:
  path: "~/Documents/facturas.xlsx"
  sheet: "Facturas"

# --- Campos a extraer (una columna por campo, en este orden) ---
# Cada campo admite:
#   type:     text (por defecto) | amount | date
#   from:     origen alternativo si ninguna expresión coincide
#             (sender | sender_email | sender_domain | date | subject)
#   patterns: lista de expresiones regulares; se usa el grupo 1 del primer match.
fields:
  proveedor:
    from: "sender"
    patterns:
      - 'proveedor\s*[:\-]\s*(.+)'
      - 'emitid[oa] por\s*[:\-]?\s*(.+)'

  numero_factura:
    patterns:
      - '(?:factura|invoice)\s*(?:n[ºo°\.]*|number|no\.?|#)?\s*[:#\-]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,})'
      - 'n[ºo°]\s*de\s*factura\s*[:#\-]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,})'

  numero_pedido:
    patterns:
      - '(?:pedido|orden|order)\s*(?:n[ºo°\.]*|no\.?|#)?\s*[:#\-]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,})'

  fecha_factura:
    type: "date"
    patterns:
      - '(?:fecha(?:\s*de\s*(?:factura|emisi[oó]n))?|date)\s*[:#\-]?\s*(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})'
      - '(\d{4}-\d{2}-\d{2})'

  base_imponible:
    type: "amount"
    patterns:
      - '(?:base\s*imponible|subtotal)\D{0,12}([\d.,]+)'

  iva:
    type: "amount"
    patterns:
      # Salta un porcentaje entre paréntesis, p. ej. "IVA (21%): 252,00".
      - '(?:i\.?v\.?a\.?|impuesto|tax|vat)\s*(?:\(\s*\d+\s*%\s*\))?\D{0,8}([\d.,]+)'

  total:
    type: "amount"
    patterns:
      - '(?:total\s*a\s*pagar|importe\s*total|total\s*due|amount\s*due)\D{0,12}([\d.,]+)'
      # 'total' como palabra suelta (evita capturar "subtotal").
      - '\btotal\b\D{0,12}([\d.,]+)'

  moneda:
    patterns:
      - '(EUR|USD|MXN|GBP|€|\$)'
